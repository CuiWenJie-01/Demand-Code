[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2word-desktop"
version = "0.1.0"
description = "Local, resumable PDF-to-DOCX conversion engine for the PDF2Word Desktop application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.0",
  "pillow>=10.0",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# PaddlePaddle 3.3.x currently has a CPU/oneDNN PIR regression that prevents
# PP-StructureV3 inference; keep the validated CPU runtime explicit.
ocr = [
  "paddlepaddle==3.2.2",
  "paddleocr==3.7.0",
  "paddlex[ocr]==3.7.2",
  "numpy>=1.24,<2.4",
  "scipy>=1.11,<1.17",
  "scikit-learn>=1.3,<1.8",
]
# Installed into a separate sidecar/runtime from ``ocr``.  Do not install both
# extras in one Python environment: Paddle's CPU and GPU distributions provide
# the same ``paddle`` package.
ocr-gpu-cu118 = [
  "paddlepaddle-gpu==3.2.2",
  "paddleocr==3.7.0",
  "paddlex[ocr]==3.7.2",
  "nvidia-cuda-runtime-cu11==11.8.89",
  "nvidia-cudnn-cu11==8.9.4.19",
  "nvidia-cublas-cu11==11.11.3.6",
  "nvidia-cufft-cu11==10.9.0.58",
  "nvidia-curand-cu11==10.3.0.86",
  "nvidia-cusolver-cu11==11.4.1.48",
  "nvidia-cusparse-cu11==11.7.5.86",
  "numpy>=1.24,<2.4",
  "scipy>=1.11,<1.17",
  "scikit-learn>=1.3,<1.8",
]
dev = ["pytest>=8.0", "reportlab>=4.0"]
word-render = ["pywin32>=306; platform_system == 'Windows'"]

[project.scripts]
pdf2word-engine = "pdf2word_engine.cli:main"
pdf2word-worker = "pdf2word_engine.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf2word_engine = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
